name: Débito Técnico
description: Registrar melhorias técnicas sem alteração de funcionalidades para o usuário.

title: "[Débito Técnico]: "

labels:
  - "Débito Técnico"

body:

  - type: markdown
    attributes:
      value: |
        ## Débito Técnico

        Utilize este template para registrar atividades de melhoria técnica da aplicação.

  - type: textarea
    id: objetivo
    attributes:
      label: Objetivo
      description: Descreva qual débito técnico será tratado.
      placeholder: Ex.: Refatorar módulo de autenticação...
    validations:
      required: true

  - type: textarea
    id: situacao
    attributes:
      label: Situação Atual
      description: Como a implementação funciona hoje?
      placeholder: Descreva a situação atual...
    validations:
      required: true

  - type: textarea
    id: problema
    attributes:
      label: Problema
      description: Quais problemas técnicos esse débito gera?
      placeholder: Descreva os impactos...
    validations:
      required: true

  - type: textarea
    id: solucao
    attributes:
      label: Solução Proposta
      description: Como o problema deverá ser resolvido?
      placeholder: Descreva a solução...
    validations:
      required: true

  - type: checkboxes
    id: beneficios
    attributes:
      label: Benefícios Esperados
      options:
        - label: Melhor manutenção
        - label: Melhor desempenho
        - label: Redução de complexidade
        - label: Maior segurança
        - label: Melhor escalabilidade
        - label: Facilita futuras implementações

  - type: dropdown
    id: impacto
    attributes:
      label: Impacto ao Usuário
      options:
        - Nenhum impacto
        - Pequeno impacto
        - Necessita indisponibilidade programada
    validations:
      required: true

  - type: checkboxes
    id: criterios
    attributes:
      label: Critérios para conclusão
      options:
        - label: Implementação concluída
        - label: Código revisado
        - label: Testes realizados
        - label: Documentação atualizada
        - label: Débito técnico eliminado
