name: Teste ou Investigação
description: Registrar uma investigação para validar um comportamento, identificar um problema ou esclarecer uma regra de negócio antes do desenvolvimento.
title: "[Teste ou Investigação] "
labels:
  - análise
assignees: []

body:
  - type: markdown
    attributes:
      value: |
        ## Teste ou Investigação

        Utilize este formulário quando for necessário investigar um comportamento, validar uma regra de negócio ou confirmar a existência de um problema antes de iniciar uma correção, melhoria ou nova funcionalidade.

  - type: textarea
    id: objetivo
    attributes:
      label: Objetivo da investigação
      description: Descreva claramente o que deverá ser investigado.
      placeholder: "Exemplo: verificar se o reconhecimento facial falha quando a iluminação é baixa."
    validations:
      required: true

  - type: textarea
    id: comportamento_esperado
    attributes:
      label: Comportamento esperado
      description: Descreva como o sistema deveria funcionar.
    validations:
      required: true

  - type: textarea
    id: hipoteses
    attributes:
      label: Hipóteses
      description: Informe possíveis causas ou pontos que deverão ser investigados.
      placeholder: |
        Exemplos:
        - Regra de negócio incorreta.
        - Erro de integração.
        - Configuração inadequada.
        - Problema de ambiente.
    validations:
      required: false

  - type: textarea
    id: roteiro
    attributes:
      label: Itens para validação
      description: Liste os pontos que deverão ser analisados.
      value: |
        - [ ]
        - [ ]
        - [ ]
    validations:
      required: true

  - type: textarea
    id: evidencias
    attributes:
      label: Evidências disponíveis
      description: Informe quais evidências serão anexadas.
      placeholder: |
        Exemplos:
        - Prints
        - Vídeos
        - Logs
        - Arquivos
        - Documentação
    validations:
      required: false

  - type: markdown
    attributes:
      value: |
        ### Anexos

        Após criar a Issue, anexe as evidências diretamente na Issue ou em um comentário.

  - type: textarea
    id: observacoes
    attributes:
      label: Observações
      description: Inclua informações complementares, quando necessário.
    validations:
      required: false
