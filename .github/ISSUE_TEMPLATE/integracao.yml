name: Integração
description: Registrar o desenvolvimento ou alteração de uma integração entre sistemas, APIs, equipamentos ou serviços.
title: "[Integração] "
labels:
  - integração
assignees: []

body:
  - type: markdown
    attributes:
      value: |
        ## Integração

        Utilize este formulário para registrar integrações com sistemas internos, APIs, equipamentos ou serviços de terceiros.

  - type: textarea
    id: objetivo
    attributes:
      label: Objetivo
      description: Descreva claramente o objetivo da integração.
      placeholder: "Exemplo: integrar o sistema com a API da SENATRAN para consulta de CNH."
    validations:
      required: true

  - type: textarea
    id: motivacao
    attributes:
      label: Motivação
      description: Informe por que essa integração é necessária.
      placeholder: |
        Exemplos:
        - Solicitação do cliente.
        - Exigência legal.
        - Automatização de processo.
        - Eliminação de retrabalho.
    validations:
      required: true

  - type: textarea
    id: necessidade
    attributes:
      label: Necessidade atendida
      description: Informe qual necessidade será atendida com esta integração.
    validations:
      required: true

  - type: textarea
    id: origem
    attributes:
      label: Sistema de origem
      description: Informe qual sistema enviará os dados.
      placeholder: "Exemplo: QDrive, ABIS, SENATRAN ou SERPRO."
    validations:
      required: true

  - type: textarea
    id: destino
    attributes:
      label: Sistema de destino
      description: Informe qual sistema receberá os dados.
    validations:
      required: true

  - type: textarea
    id: fluxo
    attributes:
      label: Fluxo da integração
      description: Descreva detalhadamente como deverá ocorrer a integração.
      placeholder: |
        Exemplo:
        1. O sistema de origem envia a requisição.
        2. A API valida os dados.
        3. O sistema de destino processa a solicitação.
        4. O retorno é enviado ao sistema de origem.
    validations:
      required: true

  - type: textarea
    id: requisitos
    attributes:
      label: Requisitos
      description: Liste todos os requisitos da integração.
      value: |
        - [ ]
        - [ ]
        - [ ]
    validations:
      required: true

  - type: textarea
    id: autenticacao
    attributes:
      label: Autenticação
      description: Informe como será realizada a autenticação.
      placeholder: |
        Exemplos:
        - Token JWT
        - OAuth2
        - Certificado digital
        - API Key
        - Basic Authentication
        - Não se aplica
    validations:
      required: false

  - type: textarea
    id: contratos
    attributes:
      label: Contratos e documentação
      description: Informe links, Swagger, documentação técnica ou contratos da API.
    validations:
      required: false

  - type: textarea
    id: criterios
    attributes:
      label: Critérios de aceite
      description: Informe como será validado que a integração foi concluída corretamente.
      value: |
        - [ ] A comunicação foi realizada com sucesso.
        - [ ] O tratamento de erros foi implementado.
        - [ ] Os logs foram implementados.
        - [ ] Os testes foram realizados.
        - [ ] A documentação foi atualizada.
        - [ ] A integração está disponível para validação.
    validations:
      required: true

  - type: textarea
    id: dependencias
    attributes:
      label: Dependências
      description: Informe dependências técnicas, fornecedores, certificados, acessos ou decisões necessárias.
      placeholder: 'Caso não existam dependências, informe "Não se aplica".'
    validations:
      required: false

  - type: textarea
    id: evidencias
    attributes:
      label: Evidências
      description: Informe quais evidências deverão ser apresentadas.
      placeholder: |
        Exemplos:
        - Print da integração.
        - Logs.
        - JSON de requisição.
        - JSON de resposta.
        - Swagger.
        - Evidências dos testes.
    validations:
      required: false

  - type: markdown
    attributes:
      value: |
        ### Anexos

        Após criar a Issue, anexe documentos, Swagger, contratos, JSONs, prints, vídeos ou outros arquivos necessários.

  - type: textarea
    id: observacoes
    attributes:
      label: Observações
      description: Inclua informações complementares, quando necessário.
    validations:
      required: false
